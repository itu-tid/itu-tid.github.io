<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" width="560" height="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="560" height="540" fill="#ffffff"/>

  <!-- App: its state and its handler, as code -->
  <rect x="60" y="20" width="440" height="150" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="280" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">App</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#3f3f46" xml:space="preserve">
    <text x="80" y="74">const [lists, setLists] = useState([]);</text>
    <text x="80" y="102">async function handleAddList(name) {</text>
    <text x="80" y="120">&#160;&#160;const savedList = await addList(name);</text>
    <text x="80" y="138">&#160;&#160;setLists([...lists, savedList]);</text>
    <text x="80" y="156">}</text>
  </g>

  <!-- Home: passes both along -->
  <rect x="60" y="240" width="440" height="56" rx="10" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Home</text>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#71717a">owns nothing here: passes lists down, onAddList up</text>

  <!-- the two siblings -->
  <rect x="30" y="370" width="220" height="86" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="140" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">MyListRow</text>
  <text x="140" y="422" text-anchor="middle" font-size="14" fill="#3f3f46">one per list,</text>
  <text x="140" y="442" text-anchor="middle" font-size="14" fill="#3f3f46">a new list, a new row</text>

  <rect x="310" y="370" width="220" height="86" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="420" y="398" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">AddForm</text>
  <text x="420" y="422" text-anchor="middle" font-size="14" fill="#3f3f46">"New list": collects</text>
  <text x="420" y="442" text-anchor="middle" font-size="14" fill="#3f3f46">a name, calls onAdd</text>

  <!-- down: lists -->
  <line x1="140" y1="172" x2="140" y2="236" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="133" y="210" text-anchor="end" font-size="13" font-weight="700" fill="#1e40af">lists</text>
  <line x1="140" y1="298" x2="140" y2="366" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="133" y="337" text-anchor="end" font-size="13" font-weight="700" fill="#1e40af">list</text>

  <!-- up: the new name -->
  <line x1="420" y1="368" x2="420" y2="300" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="427" y="337" font-size="13" font-weight="700" fill="#92400e">onAdd(name)</text>
  <line x1="420" y1="238" x2="420" y2="174" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="427" y="210" font-size="13" font-weight="700" fill="#92400e">onAddList(name)</text>

  <!-- no direct line between siblings -->
  <line x1="254" y1="413" x2="306" y2="413" stroke="#b42318" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="280" y="407" text-anchor="middle" font-size="16" font-weight="700" fill="#b42318">✗</text>
  <text x="280" y="482" text-anchor="middle" font-size="13" fill="#b42318">siblings have no line between them</text>

  <!-- legend -->
  <text x="30" y="518" font-size="13" fill="#3f3f46">The form never touches the rows. It reports up; App changes lists; the rows redraw.</text>
</svg>
