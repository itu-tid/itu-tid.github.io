<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- lane heads -->
  <rect x="40" y="20" width="200" height="56" rx="10" fill="#fff4e5" stroke="#d97706" stroke-width="2"/>
  <text x="140" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">The user's phone</text>
  <text x="140" y="65" text-anchor="middle" font-size="12" fill="#92400e">no key here</text>

  <rect x="350" y="20" width="200" height="56" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Your backend</text>
  <text x="450" y="65" text-anchor="middle" font-size="12" fill="#1e40af">a cloud function, with the key</text>

  <rect x="660" y="20" width="200" height="56" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="760" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="#18181b">Translation API</text>
  <text x="760" y="65" text-anchor="middle" font-size="12" fill="#71717a">bills you per request</text>

  <!-- lifelines -->
  <line x1="140" y1="76" x2="140" y2="380" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="450" y1="76" x2="450" y2="380" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="760" y1="76" x2="760" y2="380" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 1 -->
  <line x1="142" y1="120" x2="446" y2="120" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="294" y="110" text-anchor="middle" font-size="14" fill="#18181b">1  translate("Haus")</text>

  <!-- 2 check -->
  <rect x="460" y="140" width="190" height="70" rx="8" fill="#e8f0fe" stroke="#2563eb"/>
  <text x="555" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">2  check first</text>
  <text x="555" y="182" text-anchor="middle" font-size="13" fill="#1e40af">logged in?</text>
  <text x="555" y="200" text-anchor="middle" font-size="13" fill="#1e40af">under today's limit?</text>

  <!-- 3 -->
  <line x1="452" y1="240" x2="756" y2="240" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="604" y="230" text-anchor="middle" font-size="14" fill="#18181b">3  request + secret key</text>

  <!-- 4 -->
  <line x1="758" y1="280" x2="454" y2="280" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="604" y="270" text-anchor="middle" font-size="14" fill="#18181b">4  "house"</text>

  <!-- 5 -->
  <text x="555" y="312" text-anchor="middle" font-size="13" fill="#1e40af">count it for this user</text>
  <line x1="448" y1="340" x2="144" y2="340" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="294" y="330" text-anchor="middle" font-size="14" fill="#18181b">5  "house"</text>

  <text x="40" y="392" font-size="13" fill="#52525b">The phone never sees the key, and every request passes a check you wrote, on a computer the user does not control.</text>
</svg>
