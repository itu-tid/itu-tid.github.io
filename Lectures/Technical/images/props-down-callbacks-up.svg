<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 386" width="520" height="386" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="520" height="386" fill="#ffffff"/>

  <!-- Parent: its state and its handler, as code -->
  <rect x="30" y="20" width="460" height="132" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="260" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">TodoList</text>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#3f3f46" xml:space="preserve">
    <text x="50" y="74">const [todos, setTodos] = useState([]);</text>
    <text x="50" y="102">function handleRemove(id) {</text>
    <text x="50" y="120">&#160;&#160;setTodos(todos.filter((t) =&gt; t.id !== id));</text>
    <text x="50" y="138">}</text>
  </g>

  <!-- Children -->
  <rect x="30" y="246" width="200" height="86" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="130" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">TodoItem</text>
  <text x="130" y="298" text-anchor="middle" font-size="14" fill="#3f3f46">draws todo.text</text>
  <text x="130" y="318" text-anchor="middle" font-size="14" fill="#3f3f46">calls onRemove(id)</text>

  <rect x="290" y="246" width="200" height="86" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="390" y="274" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">TodoItem</text>
  <text x="390" y="298" text-anchor="middle" font-size="14" fill="#3f3f46">draws todo.text</text>
  <text x="390" y="318" text-anchor="middle" font-size="14" fill="#3f3f46">calls onRemove(id)</text>

  <!-- Left child arrows -->
  <line x1="95" y1="154" x2="95" y2="242" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="88" y="203" text-anchor="end" font-size="13" font-weight="700" fill="#1e40af">todo</text>
  <line x1="160" y1="244" x2="160" y2="156" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="167" y="203" font-size="13" font-weight="700" fill="#92400e">onRemove(id)</text>

  <!-- Right child arrows -->
  <line x1="355" y1="154" x2="355" y2="242" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="348" y="203" text-anchor="end" font-size="13" font-weight="700" fill="#1e40af">todo</text>
  <line x1="420" y1="244" x2="420" y2="156" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="427" y="203" font-size="13" font-weight="700" fill="#92400e">onRemove(id)</text>

  <!-- Legend -->
  <text x="30" y="364" font-size="13" fill="#1e40af"><tspan font-weight="700">Down, as props:</tspan> the data the row draws.</text>
  <text x="290" y="364" font-size="13" fill="#92400e"><tspan font-weight="700">Up, via a callback:</tspan> "I was clicked."</text>
</svg>
