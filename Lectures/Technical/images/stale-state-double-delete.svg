<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="660" height="330" fill="#ffffff"/>

  <!-- what is on screen: one box per render -->
  <text x="20" y="28" font-size="13" font-weight="700" fill="#3f3f46">On screen</text>
  <rect x="20" y="38" width="320" height="62" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="34" y="58" font-size="12" fill="#71717a">render 1</text>
  <text x="180" y="86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#18181b">A  B  C</text>

  <rect x="340" y="38" width="150" height="62" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="354" y="58" font-size="12" fill="#71717a">render 2</text>
  <text x="415" y="86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#18181b">B  C</text>

  <rect x="490" y="38" width="150" height="62" rx="8" fill="#fef3f2" stroke="#b42318" stroke-width="1.5"/>
  <text x="504" y="58" font-size="12" fill="#71717a">render 3</text>
  <text x="565" y="86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#18181b"><tspan fill="#b42318" font-weight="700">A</tspan>  C</text>
  <text x="630" y="58" text-anchor="end" font-size="12" font-weight="700" fill="#b42318">A is back</text>

  <!-- delete A -->
  <text x="20" y="146" font-size="13" font-weight="700" fill="#3f3f46">Delete A</text>
  <circle cx="90" cy="168" r="5" fill="#3f3f46"/>
  <text x="90" y="192" text-anchor="middle" font-size="11" fill="#71717a">click</text>
  <rect x="102" y="156" width="118" height="24" rx="5" fill="#ffffff" stroke="#a1a1aa"/>
  <text x="161" y="173" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3f3f46">todos: A, B, C</text>
  <line x1="222" y1="168" x2="336" y2="168" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="279" y="160" text-anchor="middle" font-size="11" fill="#71717a">waits for the server</text>
  <line x1="340" y1="168" x2="340" y2="104" stroke="#d97706" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="346" y="140" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#92400e">setTodos([B, C])</text>

  <!-- delete B -->
  <text x="20" y="226" font-size="13" font-weight="700" fill="#3f3f46">Delete B</text>
  <circle cx="160" cy="248" r="5" fill="#3f3f46"/>
  <text x="160" y="272" text-anchor="middle" font-size="11" fill="#71717a">click</text>
  <rect x="172" y="236" width="118" height="24" rx="5" fill="#fef3f2" stroke="#b42318"/>
  <text x="231" y="253" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#b42318">todos: A, B, C</text>
  <text x="231" y="276" text-anchor="middle" font-size="11" fill="#b42318">render 1's copy, kept</text>
  <line x1="292" y1="248" x2="486" y2="248" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="389" y="240" text-anchor="middle" font-size="11" fill="#71717a">waits for the server</text>
  <line x1="490" y1="248" x2="490" y2="104" stroke="#b42318" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="496" y="212" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#b42318">setTodos([A, C])</text>

  <!-- time -->
  <line x1="20" y1="306" x2="636" y2="306" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr-grey)"/>
  <text x="640" y="322" text-anchor="end" font-size="12" fill="#71717a">time</text>
</svg>
