<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" width="560" height="384" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
  </defs>
  <rect width="560" height="384" fill="#ffffff"/>

  <!-- Parent: the state, and no handler any more -->
  <rect x="30" y="20" width="460" height="110" rx="10" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="260" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">TodoList</text>
  <text x="50" y="74" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#3f3f46">const [todos, setTodos] = useState([]);</text>
  <text x="50" y="100" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#b42318">// no handleRemove:</text>
  <text x="50" y="118" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#b42318">// every row decides what removing means</text>

  <!-- Children -->
  <rect x="30" y="224" width="200" height="86" rx="10" fill="#fef3f2" stroke="#b42318" stroke-width="1.5"/>
  <text x="130" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">TodoItem</text>
  <text x="130" y="276" text-anchor="middle" font-size="14" fill="#3f3f46">knows the whole list,</text>
  <text x="130" y="296" text-anchor="middle" font-size="14" fill="#3f3f46">and rewrites it itself</text>

  <rect x="290" y="224" width="200" height="86" rx="10" fill="#fef3f2" stroke="#b42318" stroke-width="1.5"/>
  <text x="390" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#18181b">TodoItem</text>
  <text x="390" y="276" text-anchor="middle" font-size="14" fill="#3f3f46">knows the whole list,</text>
  <text x="390" y="296" text-anchor="middle" font-size="14" fill="#3f3f46">and rewrites it itself</text>

  <!-- Left child arrows -->
  <line x1="95" y1="132" x2="95" y2="220" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr-grey)"/>
  <text x="88" y="172" text-anchor="end" font-size="12" fill="#3f3f46">todo,</text>
  <text x="88" y="188" text-anchor="end" font-size="12" fill="#3f3f46">todos,</text>
  <text x="88" y="204" text-anchor="end" font-size="12" fill="#3f3f46">setTodos</text>
  <line x1="160" y1="222" x2="160" y2="134" stroke="#b42318" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr-red)"/>
  <text x="167" y="174" font-size="12" font-weight="700" fill="#b42318">setTodos(</text>
  <text x="167" y="190" font-size="12" font-weight="700" fill="#b42318">&#160;&#160;todos.filter(…))</text>

  <!-- Right child arrows -->
  <line x1="355" y1="132" x2="355" y2="220" stroke="#3a3a3a" stroke-width="2" marker-end="url(#arr-grey)"/>
  <text x="348" y="172" text-anchor="end" font-size="12" fill="#3f3f46">todo,</text>
  <text x="348" y="188" text-anchor="end" font-size="12" fill="#3f3f46">todos,</text>
  <text x="348" y="204" text-anchor="end" font-size="12" fill="#3f3f46">setTodos</text>
  <line x1="420" y1="222" x2="420" y2="134" stroke="#b42318" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arr-red)"/>
  <text x="427" y="174" font-size="12" font-weight="700" fill="#b42318">setTodos(</text>
  <text x="427" y="190" font-size="12" font-weight="700" fill="#b42318">&#160;&#160;todos.filter(…))</text>

  <!-- Legend -->
  <text x="30" y="342" font-size="13" fill="#b42318">Every row can now rewrite every other row.</text>
  <text x="30" y="362" font-size="13" fill="#b42318">Change how deletion works, and you have to change the row.</text>
</svg>
