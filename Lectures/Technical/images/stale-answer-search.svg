<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#ffffff"/>

  <!-- what is on screen -->
  <text x="20" y="28" font-size="13" font-weight="700" fill="#3f3f46">On screen</text>
  <rect x="20" y="38" width="180" height="62" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="34" y="58" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#71717a">search: mi</text>
  <text x="110" y="86" text-anchor="middle" font-size="15" fill="#3f3f46">Searching…</text>

  <rect x="200" y="38" width="200" height="62" rx="8" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="214" y="58" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#71717a">search: mil</text>
  <text x="300" y="86" text-anchor="middle" font-size="15" fill="#3f3f46">Searching…</text>

  <rect x="400" y="38" width="110" height="62" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="414" y="58" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#71717a">search: mil</text>
  <text x="455" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">milk</text>

  <rect x="510" y="38" width="130" height="62" rx="8" fill="#fef3f2" stroke="#b42318" stroke-width="1.5"/>
  <text x="524" y="58" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#71717a">search: mil</text>
  <text x="575" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#b42318">milk, mints,</text>
  <text x="575" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#b42318">mirror ?!</text>

  <!-- search "mi": slow -->
  <text x="20" y="150" font-size="13" font-weight="700" fill="#3f3f46">Search “mi”</text>
  <circle cx="40" cy="172" r="5" fill="#3f3f46"/>
  <text x="40" y="196" text-anchor="middle" font-size="11" fill="#71717a">type mi</text>
  <line x1="46" y1="172" x2="506" y2="172" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#71717a">a slower answer: more to-dos match “mi”</text>
  <line x1="510" y1="172" x2="510" y2="104" stroke="#b42318" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="516" y="136" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#b42318">setResults(…)</text>

  <!-- search "mil": fast -->
  <text x="20" y="232" font-size="13" font-weight="700" fill="#3f3f46">Search “mil”</text>
  <circle cx="210" cy="252" r="5" fill="#3f3f46"/>
  <text x="210" y="276" text-anchor="middle" font-size="11" fill="#71717a">type l</text>
  <line x1="216" y1="252" x2="396" y2="252" stroke="#71717a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="306" y="244" text-anchor="middle" font-size="11" fill="#71717a">a faster answer</text>
  <line x1="400" y1="252" x2="400" y2="104" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="406" y="216" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" font-weight="700" fill="#15803d">setResults(…)</text>

  <!-- time -->
  <line x1="20" y1="300" x2="636" y2="300" stroke="#71717a" stroke-width="1.5" marker-end="url(#arr-grey)"/>
  <text x="640" y="316" text-anchor="end" font-size="12" fill="#71717a">time</text>
  <text x="330" y="334" text-anchor="middle" font-size="13" fill="#3f3f46">With the ignore flag, typing the l marks the “mi” answer as stale, and it is dropped when it arrives.</text>
</svg>
